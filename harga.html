<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Struk Pesanan - RM Etan Kuburan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Oswald:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=sangar_clean">
</head>
<body>
    <div class="receipt-wrapper">
        <div class="receipt-card">
            <!-- Receipt Header -->
            <div class="receipt-header">
                <h1 class="receipt-brand">RM ETAN <span class="accent-red">KUBURAN</span></h1>
                <p class="receipt-subtitle">STRUK PESANAN RESMI</p>
            </div>

            <div class="invoice-meta">
                <div class="meta-row">
                    <span>No. Transaksi</span>
                    <strong id="invoiceId">-</strong>
                </div>
                <div class="meta-row">
                    <span>Nama Pemesan</span>
                    <strong id="customerName">Pelanggan</strong>
                </div>
                <div class="meta-row">
                    <span>Waktu Pemesanan</span>
                    <span id="orderTime">-</span>
                </div>
            </div>

            <!-- Dynamic Container for Ordered Items or Empty State -->
            <div id="receiptContent"></div>

            <div class="receipt-footer">
                <p>Terima kasih atas kunjungan Anda di <strong>RM Etan Kuburan</strong>.</p>
                <small>Sensasi kuliner tradisional dengan racikan resep legendaris.</small>
            </div>
        </div>
    </div>

    <script>
    function formatRupiah(number) {
        return 'Rp ' + number.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Generate Invoice ID & Date
        const now = new Date();
        const dateStr = now.getFullYear().toString() +
            String(now.getMonth() + 1).padStart(2, '0') +
            String(now.getDate()).padStart(2, '0');
        const randCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        document.getElementById('invoiceId').textContent = 'INV-' + dateStr + '-' + randCode;

        // Customer Name from sessionStorage
        const savedName = sessionStorage.getItem('nama') || 'Pelanggan';
        document.getElementById('customerName').textContent = savedName;

        // Formatted Time
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        const formattedDate = `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()} • ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} WIB`;
        document.getElementById('orderTime').innerHTML = formattedDate;

        // Retrieve Order Items
        const storedItems = sessionStorage.getItem('order_items');
        let orderItems = [];
        let totalBayar = 0;

        if (storedItems) {
            try {
                orderItems = JSON.parse(storedItems);
                totalBayar = parseInt(sessionStorage.getItem('order_total')) || 0;
            } catch (e) {
                orderItems = [];
            }
        }

        const container = document.getElementById('receiptContent');

        if (!orderItems || orderItems.length === 0) {
            // Empty State
            container.innerHTML = `
                <div class="empty-receipt-alert">
                    <div class="alert-icon">⚠️</div>
                    <h3>Tidak Ada Menu yang Dipilih</h3>
                    <p>Mohon centang menu yang ingin dipesan terlebih dahulu sebelum mengonfirmasi order.</p>
                    <a href="menu.html" class="btn-return-menu">Kembali ke Daftar Menu</a>
                </div>
            `;
        } else {
            // Render Order Items Table
            let rowsHtml = '';
            orderItems.forEach(item => {
                rowsHtml += `
                    <tr>
                        <td>
                            <div class="receipt-item-title">
                                <span>${item.icon}</span>
                                <b>${item.nama}</b>
                            </div>
                        </td>
                        <td class="col-center">${item.porsi}x</td>
                        <td class="col-right">${formatRupiah(item.harga)}</td>
                        <td class="col-right" style="font-weight: 700; color: #D62828;">${formatRupiah(item.subtotal)}</td>
                    </tr>
                `;
            });

            container.innerHTML = `
                <div class="table-wrapper">
                    <table class="receipt-table">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th class="col-center">Qty</th>
                                <th class="col-right">Harga</th>
                                <th class="col-right">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                </div>

                <div class="receipt-total-box">
                    <div class="total-label">Total Pembayaran</div>
                    <div class="total-amount">${formatRupiah(totalBayar)}</div>
                    <div class="total-status">
                        <span class="status-badge">Menunggu Pembayaran di Kasir</span>
                    </div>
                </div>

                <div class="receipt-actions">
                    <a href="menu.html" class="btn-return-menu">
                        &larr; Pesan Menu Lain
                    </a>
                    <a href="index.html" class="btn-logout-receipt" onclick="sessionStorage.clear()">
                        Keluar
                    </a>
                </div>
            `;
        }
    });
    </script>
</body>
</html>
