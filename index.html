<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Halo Bolo Josjis - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Oswald:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="belajar.css?v=sangar_clean">
</head>
<body>
    <div class="login-container">
        <form id="loginForm" class="luxury-form" onsubmit="handleLogin(event)">
            <div class="brand-badge">
                <span class="badge-text">PORTAL OTENTIKASI RESMI</span>
            </div>

            <h1 class="form-title">HALO BOLO <span class="accent-red">JOSJIS</span></h1>
            <p class="form-subtitle">Masukkan nama pengguna dan kata sandi untuk masuk ke sistem.</p>

            <div class="input-group">
                <label for="nama">NAMA PENGGUNA / USERNAME</label>
                <div class="input-wrapper">
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama..." required autocomplete="username" autofocus>
                </div>
            </div>

            <div class="input-group">
                <label for="pass">KATA SANDI / PASSWORD</label>
                <div class="input-wrapper">
                    <input type="password" id="pass" name="pass" placeholder="Masukkan password..." required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-luxury-submit">
                MASUK KE SISTEM
            </button>
        </form>
    </div>

    <script>
    function handleLogin(event) {
        event.preventDefault();
        const namaInput = document.getElementById('nama').value.trim();
        const passInput = document.getElementById('pass').value.trim();
        const nama = namaInput.toLowerCase();

        // 1. User Aghis -> Menu Makanan RM Etan Kuburan
        if (nama === 'aghis' && passInput === '123') {
            sessionStorage.setItem('loggedin', 'true');
            sessionStorage.setItem('nama', 'Aghis');
            sessionStorage.setItem('role', 'user');
            window.location.href = 'menu.html';
        }
        // 2. User Deril -> Hitung Luas Persegi Panjang / Balok
        else if (nama === 'deril' && passInput === '911') {
            sessionStorage.setItem('loggedin', 'true');
            sessionStorage.setItem('nama', 'Deril');
            sessionStorage.setItem('role', 'user');
            window.location.href = 'MTK.html';
        }
        // 3. User Udin -> Struktur Tabel Colspan & Rowspan
        else if (nama === 'udin' && passInput === '456') {
            sessionStorage.setItem('loggedin', 'true');
            sessionStorage.setItem('nama', 'Udin');
            sessionStorage.setItem('role', 'user');
            window.location.href = 'table.html';
        }
        // 4. User Admin -> Dashboard Evaluasi Nilai Siswa
        else if (nama === 'admin' && passInput === '111') {
            sessionStorage.setItem('loggedin', 'true');
            sessionStorage.setItem('nama', 'Admin');
            sessionStorage.setItem('role', 'admin');
            window.location.href = 'admin.html';
        }
        // Gagal login
        else {
            alert('Salah login bg 😅\nPeriksa kembali username dan password Anda!');
        }
    }
    </script>
</body>
</html>
