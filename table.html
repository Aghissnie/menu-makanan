<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Struktur Tabel - Udin Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Oswald:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0D0D0D;
            --bg-surface: #161616;
            --border-color: #2A2A2A;
            --text-main: #F2F2F2;
            --text-muted: #8A8A8A;
            --accent-red: #D62828;
            --accent-red-hover: #B51F1F;
            --font-heading: 'Oswald', 'Bebas Neue', sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .table-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 44px 36px;
            width: 100%;
            max-width: 680px;
            text-align: center;
        }

        .section-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .title {
            font-family: var(--font-heading);
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .user-greeting {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 30px;
        }

        .user-greeting b {
            color: var(--accent-red);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        td {
            border: 1px solid var(--border-color);
            height: 60px;
            text-align: center;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            padding: 8px;
            background-color: var(--bg-main);
        }

        .nama-cell {
            width: 25%;
            vertical-align: middle;
            font-family: var(--font-heading);
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            background-color: #1a1a1a;
            color: var(--accent-red);
            border-right: 2px solid var(--accent-red);
        }

        .aksen-merah {
            background-color: rgba(214, 40, 40, 0.15);
            border-color: var(--accent-red);
            color: var(--accent-red);
            font-weight: 700;
        }

        .btn-logout {
            display: inline-block;
            padding: 10px 24px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            color: var(--text-muted);
            font-family: var(--font-heading);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            color: var(--accent-red);
            border-color: var(--accent-red);
            background: #1a1a1a;
        }
    </style>
</head>
<body>

<div class="table-card">
    <span class="section-tag">HTML ADVANCED TABLE STRUCTURE</span>
    <h1 class="title">Struktur Colspan &amp; Rowspan</h1>
    <div class="user-greeting">
        Akses Pengguna: <b id="userName">Udin</b>
    </div>

    <table>
        <tr>
            <td class="nama-cell" rowspan="3">UDIN</td>
            <td>Item Sel 1</td>
            <td colspan="3">Item Gabungan 3 Kolom (Colspan 3)</td>
        </tr>
        <tr>
            <td>Item Sel 2</td>
            <td class="aksen-merah" colspan="2">Aksen Merah Solid (Colspan 2)</td>
            <td>Item Sel 3</td>
        </tr>
        <tr>
            <td colspan="2">Item Gabungan 2 Kolom (Colspan 2)</td>
            <td>Item Sel 4</td>
            <td>Item Sel 5</td>
        </tr>
    </table>

    <a href="index.html" class="btn-logout" onclick="sessionStorage.clear()">Keluar (Logout)</a>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const savedName = sessionStorage.getItem('nama') || 'Udin';
    document.getElementById('userName').textContent = savedName;
});
</script>

</body>
</html>
