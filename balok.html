<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Hasil Komputasi Geometri - Luas Persegi Panjang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Oswald:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0D0D0D;
            --bg-surface: #161616;
            --border-color: #2A2A2A;
            --text-main: #F2F2F2;
            --text-muted: #8A8A8A;
            --accent-red: #D62828;
            --accent-red-hover: #B51F1F;
            --font-heading: 'Oswald', 'Bebas Neue', sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .result-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 44px 36px;
            max-width: 460px;
            width: 100%;
            text-align: center;
        }

        .badge-header {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: inline-block;
        }

        .result-title {
            font-family: var(--font-heading);
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-main);
            margin-bottom: 25px;
        }

        .computation-box {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }

        .param-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 14px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }

        .param-row:last-of-type {
            border-bottom: none;
        }

        .param-row strong {
            color: var(--text-main);
            font-size: 15px;
            font-weight: 700;
        }

        .formula-card {
            background-color: #121212;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            padding: 18px;
            margin-top: 15px;
            text-align: center;
        }

        .formula-title {
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .hasil-value {
            font-family: var(--font-heading);
            font-size: 40px;
            font-weight: 900;
            color: var(--accent-red);
            letter-spacing: 1px;
        }

        .action-grid {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-again {
            flex: 1;
            padding: 14px 20px;
            background-color: var(--accent-red);
            border-radius: 2px;
            color: #FFFFFF;
            text-decoration: none;
            font-family: var(--font-heading);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .btn-again:hover {
            background-color: var(--accent-red-hover);
            transform: translateY(-2px);
        }

        .btn-logout {
            padding: 14px 22px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            color: var(--text-muted);
            text-decoration: none;
            font-family: var(--font-heading);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .btn-logout:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
            background: #1a1a1a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="result-card">
        <span class="badge-header">HASIL KOMPUTASI</span>
        <h2 class="result-title">Luas Persegi Panjang</h2>

        <div class="computation-box">
            <div class="param-row">
                <span>Panjang (p)</span>
                <strong id="valPanjang">0</strong>
            </div>
            <div class="param-row">
                <span>Lebar (l)</span>
                <strong id="valLebar">0</strong>
            </div>
            <div class="param-row">
                <span>Formula</span>
                <code>Luas = p &times; l</code>
            </div>

            <div class="formula-card">
                <div class="formula-title">Total Luas Bangun Datar</div>
                <div class="hasil-value" id="valHasil">0</div>
            </div>
        </div>

        <div class="action-grid">
            <a href="MTK.html" class="btn-again">Hitung Ulang</a>
            <a href="index.html" class="btn-logout" onclick="sessionStorage.clear()">Keluar</a>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const p = sessionStorage.getItem('mtk_panjang');
        const l = sessionStorage.getItem('mtk_lebar');
        const h = sessionStorage.getItem('mtk_hasil');

        if (!p || !l || !h) {
            window.location.href = 'MTK.html';
            return;
        }

        document.getElementById('valPanjang').textContent = p;
        document.getElementById('valLebar').textContent = l;
        document.getElementById('valHasil').textContent = h;
    });
    </script>
</body>
</html>
